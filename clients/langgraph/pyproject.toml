[project]
name = "a2human-langgraph"
version = "0.1.0"
description = "A small LangGraph client that dispatches work to people who are on duty in A2Human."
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0",
  "langgraph>=1.0",
]

[project.scripts]
a2human = "a2human.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a2human*"]
